<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-label="AnimCraft — a curated gallery of copy-paste CSS and Tailwind animations">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b49bff"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b49bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".07"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowV" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity=".55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <style>
      .word { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, ui-monospace, monospace; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1600" height="500" fill="#06060a"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <ellipse cx="250" cy="90" rx="420" ry="280" fill="url(#glowV)"/>
  <ellipse cx="1330" cy="430" rx="420" ry="300" fill="url(#glowC)"/>
  <rect y="0" width="1600" height="500" fill="url(#fade)" opacity=".35"/>

  <!-- Brand mark -->
  <g transform="translate(96 84)">
    <rect width="54" height="54" rx="16" fill="url(#btn)"/>
    <path d="M17 37 27 15l10 22" fill="none" stroke="#08080d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="27" cy="30" r="3.4" fill="#08080d"/>
  </g>
  <text x="166" y="122" class="word" font-size="40" font-weight="700" letter-spacing="-1.2" fill="#f4f4fa">Anim<tspan fill="url(#brand)">Craft</tspan></text>

  <!-- Headline -->
  <text x="96" y="238" class="word" font-size="64" font-weight="700" letter-spacing="-2.2" fill="#f4f4fa">Motion that makes</text>
  <text x="96" y="308" class="word" font-size="64" font-weight="700" letter-spacing="-2.2" fill="url(#brand)">interfaces sing.</text>

  <!-- Subline -->
  <text x="98" y="356" class="word" font-size="21" fill="#9a9ab0">A curated, zero-dependency gallery of CSS &amp; Tailwind animations.</text>
  <text x="98" y="384" class="word" font-size="21" fill="#9a9ab0">Preview it live. Copy the code. Ship it in seconds.</text>

  <!-- Chips -->
  <g transform="translate(98 408)">
    <g>
      <rect width="150" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="18" y="22" class="mono" font-size="12.5" letter-spacing="1.2" fill="#b49bff">31 ANIMATIONS</text>
    </g>
    <g transform="translate(162 0)">
      <rect width="132" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="18" y="22" class="mono" font-size="12.5" letter-spacing="1.2" fill="#34d399">0 DEPS</text>
    </g>
    <g transform="translate(306 0)">
      <rect width="158" height="34" rx="17" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="18" y="22" class="mono" font-size="12.5" letter-spacing="1.2" fill="#22d3ee">CSS + TAILWIND</text>
    </g>
  </g>

  <!-- Preview panel -->
  <g transform="translate(940 96)">
    <rect x="0" y="0" width="564" height="308" rx="20" fill="#0c0c14" stroke="#ffffff" stroke-opacity=".14"/>
    <!-- window chrome -->
    <circle cx="24" cy="26" r="5" fill="#ff5f57"/>
    <circle cx="42" cy="26" r="5" fill="#febc2e"/>
    <circle cx="60" cy="26" r="5" fill="#28c840"/>
    <text x="82" y="30" class="mono" font-size="12" fill="#6b6b83">aurora-button.css</text>
    <rect x="458" y="16" width="56" height="21" rx="10.5" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".3"/>
    <text x="470" y="30.5" class="mono" font-size="10" letter-spacing="1.4" fill="#34d399">LIVE</text>
    <line x1="0" y1="48" x2="564" y2="48" stroke="#ffffff" stroke-opacity=".08"/>

    <!-- stage -->
    <rect x="1" y="49" width="562" height="176" fill="#08080e"/>
    <g opacity=".5">
      <path d="M1 93h562M1 137h562M1 181h562" stroke="#ffffff" stroke-opacity=".05"/>
      <path d="M113 49v176M225 49v176M337 49v176M449 49v176" stroke="#ffffff" stroke-opacity=".05"/>
    </g>
    <ellipse cx="282" cy="150" rx="190" ry="104" fill="url(#glowV)" opacity=".9" filter="url(#soft)"/>

    <g transform="translate(282 137)">
      <rect x="-142" y="-30" width="284" height="60" rx="28" fill="#8b5cf6" opacity=".55" filter="url(#soft)"/>
      <rect x="-96" y="-22" width="192" height="46" rx="14" fill="url(#btn)"/>
      <text x="0" y="5" text-anchor="middle" class="word" font-size="16.5" font-weight="700" fill="#08080f">Aurora Glow</text>
    </g>
    <text x="282" y="243" text-anchor="middle" class="mono" font-size="9.5" letter-spacing="2.4" fill="#ffffff" fill-opacity=".28">HOVER THE BUTTON</text>

    <!-- code -->
    <line x1="0" y1="249" x2="564" y2="249" stroke="#ffffff" stroke-opacity=".08"/>
    <text x="24" y="275" class="mono" font-size="12.5" fill="#c8c8dd"><tspan fill="#f472b6">&lt;button</tspan> <tspan fill="#b49bff">class</tspan><tspan fill="#8b8ba7">=</tspan><tspan fill="#a3e635">"glow-btn"</tspan><tspan fill="#f472b6">&gt;</tspan></text>
    <text x="44" y="295" class="mono" font-size="12.5" fill="#e3e3f0">Aurora Glow</text>
    <text x="24" y="315" class="mono" font-size="12.5" fill="#f472b6">&lt;/button&gt;</text>
  </g>

  <!-- Floating chips -->
  <g transform="translate(884 66)">
    <rect width="128" height="32" rx="16" fill="#11111b" stroke="#ffffff" stroke-opacity=".14"/>
    <circle cx="18" cy="16" r="3.4" fill="#b49bff"/>
    <text x="30" y="21" class="mono" font-size="11" letter-spacing=".6" fill="#d3d3e2">KEYBOARD FIRST</text>
  </g>
  <g transform="translate(1270 424)">
    <rect width="118" height="32" rx="16" fill="#11111b" stroke="#ffffff" stroke-opacity=".14"/>
    <circle cx="18" cy="16" r="3.4" fill="#34d399"/>
    <text x="30" y="21" class="mono" font-size="11" letter-spacing=".6" fill="#d3d3e2">MIT LICENSED</text>
  </g>

  <!-- Footer URL -->
  <text x="1504" y="470" text-anchor="end" class="mono" font-size="12.5" letter-spacing=".4" fill="#6b6b83">github.com/saturogojo777/anim-craft</text>
</svg>
